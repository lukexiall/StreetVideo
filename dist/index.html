<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreetTree Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>/* Layout concept: a plan-drawing workbench. A quiet paper surface with ink
   linework; one deep eucalyptus accent for actions; ochre marks targets and
   selection. Data in a mono face, like dimension text on a drawing. */
:root {
  --bg: #f3f4ef;
  --surface: #fbfbf8;
  --surface-2: #eceee6;
  --ink: #18241f;
  --ink-2: #4a5852;
  --ink-3: #75817b;
  --line: #d6dad0;
  --line-2: #c3c9bd;
  --accent: #1d6a55;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --ochre: #b77a1f;
  --ochre-soft: #f3e5c9;
  --good: #2f7d4a;
  --warn: #a8650f;
  --bad: #b23a2e;
  --bad-soft: #f6dcd8;
  --thesis: #275f8a;
  --thesis-soft: #dde9f3;
  --seq-lo: #eef1e6;
  --seq-hi: #2c6b3e;
  /* plan drawing */
  --pl-bld: #d9d4c8;
  --pl-hatch: #bdb6a7;
  --pl-footpath: #ebe5d7;
  --pl-parking: #cfd0cb;
  --pl-lane: #b9bbb7;
  --pl-median: #cfdcbc;
  --pl-kerb: #8e918a;
  --pl-mark: #fbfbf6;
  --pl-veil: rgba(243, 244, 239, 0.62);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
  --r-sm: 6px;
  --shadow: 0 1px 2px rgba(24, 36, 31, 0.06), 0 8px 24px rgba(24, 36, 31, 0.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #111714; --surface: #18201c; --surface-2: #1f2925; --ink: #e6ece7; --ink-2: #b2bdb6; --ink-3: #849089;
    --line: #2b3631; --line-2: #3a4741; --accent: #4fb592; --accent-ink: #0b1712; --accent-soft: #1c3a30;
    --ochre: #e0a54b; --ochre-soft: #3b2e17; --good: #5cc07c; --warn: #e3a04a; --bad: #ef7a6c; --bad-soft: #3d1f1b;
    --thesis: #7fb4dc; --thesis-soft: #1b2d3b; --seq-lo: #1f2a24; --seq-hi: #6fcf8b;
    --pl-bld: #2a2f2b; --pl-hatch: #3b423d; --pl-footpath: #39372f; --pl-parking: #2f3331; --pl-lane: #262a29;
    --pl-median: #2f3e2b; --pl-kerb: #6d736d; --pl-mark: #9da39c; --pl-veil: rgba(17, 23, 20, 0.6);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #111714; --surface: #18201c; --surface-2: #1f2925; --ink: #e6ece7; --ink-2: #b2bdb6; --ink-3: #849089;
  --line: #2b3631; --line-2: #3a4741; --accent: #4fb592; --accent-ink: #0b1712; --accent-soft: #1c3a30;
  --ochre: #e0a54b; --ochre-soft: #3b2e17; --good: #5cc07c; --warn: #e3a04a; --bad: #ef7a6c; --bad-soft: #3d1f1b;
  --thesis: #7fb4dc; --thesis-soft: #1b2d3b; --seq-lo: #1f2a24; --seq-hi: #6fcf8b;
  --pl-bld: #2a2f2b; --pl-hatch: #3b423d; --pl-footpath: #39372f; --pl-parking: #2f3331; --pl-lane: #262a29;
  --pl-median: #2f3e2b; --pl-kerb: #6d736d; --pl-mark: #9da39c; --pl-veil: rgba(17, 23, 20, 0.6);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
#root { height: 100%; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(26px, 3.2vw, 38px); font-weight: 650; line-height: 1.08; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
h4 { font-size: 13px; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); font-weight: 600; margin-bottom: 6px; }
.lede { color: var(--ink-2); font-size: 15px; max-width: 62ch; }
.fine { color: var(--ink-3); font-size: 12px; line-height: 1.45; }
.muted { color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

/* ---------- app shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 18px; height: 54px; flex: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0; font-family: var(--font-display); font-size: 17px; white-space: nowrap; }
.brand b { font-weight: 700; }
.logo-bg { fill: var(--accent); }
.logo-crown { fill: var(--accent-ink); opacity: 0.92; }
.logo-crown.alt { opacity: 0.7; }
.logo-line { stroke: var(--accent-ink); stroke-width: 1.8; stroke-linecap: round; fill: none; }
.mainnav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.mainnav button { background: none; border: 0; padding: 8px 12px; border-radius: var(--r-sm); color: var(--ink-2); cursor: pointer; white-space: nowrap; font-weight: 500; }
.mainnav button:hover { background: var(--surface-2); color: var(--ink); }
.mainnav button.is-on { color: var(--ink); background: var(--accent-soft); }
.version { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; flex: none; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
.crumbs button { background: none; border: 0; color: var(--ink-3); cursor: pointer; padding: 2px 4px; }
.crumbs button:hover { color: var(--accent); }
.crumbs button.is-last { color: var(--ink); font-weight: 600; }
.crumb-sep { color: var(--line-2); margin: 0 2px; }
.stage { flex: 1; min-height: 0; overflow: auto; }
.view-design .stage { overflow: hidden; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; transition: background 0.15s, border-color 0.15s; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); border-color: transparent; }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn-danger:hover { background: var(--bad-soft); }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn-lg { padding: 11px 18px; font-size: 15px; }
.btn.is-on { background: var(--accent-soft); border-color: var(--accent); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 18px; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip-accent { background: var(--ochre-soft); color: var(--ochre); }
.chip-thesis { background: var(--thesis-soft); color: var(--thesis); max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.chip-warn { background: var(--ochre-soft); color: var(--warn); }
.src { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; vertical-align: 1px; }
.src-ref { font-weight: 500; }
.src-thesis { color: var(--thesis); }
.src-derived { color: var(--thesis); border-style: dashed; }
.src-estimate { color: var(--ochre); }
.src-assumption { color: var(--ink-3); border-style: dashed; }
.src-missing { color: var(--bad); border-style: dotted; }
.src-demo { color: var(--ink-3); border-style: dotted; }
.src-row { display: flex; flex-wrap: wrap; gap: 6px; }
.missing { color: var(--ink-3); font-size: 11.5px; font-style: italic; white-space: nowrap; }
.seg-pill { background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg-pill:hover { border-color: var(--ink-3); color: var(--ink); }
.seg-pill.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
.seg-ctl button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); border-left: 1px solid var(--line); }
.seg-ctl button:first-child { border-left: 0; }
.seg-ctl button.is-on { background: var(--accent); color: var(--accent-ink); }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.field select, .field input, .field-inline select, .lib-search { padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); font-size: 13px; }
.field-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.check { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--accent); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; flex: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.kv { display: grid; gap: 0; margin: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.kv dt { color: var(--ink-3); font-size: 12.5px; }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.kv-tight > div { padding: 3px 0; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; max-width: 100%; }
table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.data th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data td.num { text-align: right; white-space: nowrap; }
table.data tr.is-short td { color: var(--ink-3); }
.flag { margin-left: 4px; font-size: 10px; color: var(--warn); font-family: var(--font-body); font-weight: 700; text-transform: uppercase; }
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--ink-3); padding: 24px 8px; }

/* ---------- toast & modal ---------- */
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px); animation: rise 0.2s ease-out; }
.toast-bad { background: var(--bad); color: #fff; }
.toast-good { background: var(--accent); color: var(--accent-ink); }
.toast-warn { background: var(--ochre); color: #1d1405; }
@keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
.modal-back { position: fixed; inset: 0; background: rgba(10, 16, 13, 0.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); width: min(560px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
.modal-wide { width: min(820px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 16px; overflow: auto; display: grid; gap: 12px; }
.copybox { display: grid; gap: 10px; }
.copybox textarea { width: 100%; min-height: 320px; font-family: var(--font-mono); font-size: 12px; padding: 10px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); resize: vertical; }
.copybox .btn { justify-self: start; }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; align-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); max-width: 1280px; margin: 0 auto; min-height: 100%; }
.home-intro { display: grid; gap: 18px; justify-items: start; }
.home-stats { display: grid; grid-template-columns: repeat(4, auto); gap: 22px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.home-stats div { display: grid; }
.home-stats b { font-family: var(--font-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.home-stats span { font-size: 12px; color: var(--ink-3); }
.map-wrap { display: grid; gap: 10px; min-width: 0; }
.aus-map { width: 100%; height: auto; max-height: 72vh; }
.state path { stroke: var(--surface); stroke-width: 1.2; stroke-linejoin: round; transition: fill 0.2s; }
.state-soon path { fill: var(--line); }
.state-soon.is-hover path { fill: var(--line-2); }
.state-active { cursor: pointer; }
.state-active path { fill: var(--accent); }
.state-active.is-hover path, .state-active:focus-visible path { fill: var(--seq-hi); }
.state-active:focus-visible { outline: none; }
.state-label { font-family: var(--font-display); font-size: 11px; font-weight: 650; fill: var(--ink-3); pointer-events: none; }
.state-active .state-label { fill: var(--accent-ink); font-size: 13px; }
.state-soon-label { font-family: var(--font-body); font-size: 7.5px; font-weight: 500; }
.adl-marker circle { fill: var(--ochre); }
.adl-pulse { fill: var(--ochre) !important; opacity: 0.3; animation: pulse 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.adl-label { font-size: 9.5px; font-weight: 700; fill: var(--accent-ink); font-family: var(--font-body); paint-order: stroke; stroke: var(--accent); stroke-width: 2.5px; }
@keyframes pulse { 0% { transform: scale(0.6); opacity: 0.5; } 100% { transform: scale(2.2); opacity: 0; } }
.map-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--ink-2); }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.lg-active { background: var(--accent); }
.lg-soon { background: var(--line); }
.map-hover { color: var(--ink-3); font-style: italic; }

/* ---------- street selection ---------- */
.streets { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 100%; }
.street-list { padding: 22px 16px 22px max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); display: grid; gap: 10px; align-content: start; background: var(--surface); }
.street-list h1 { font-size: 26px; margin-bottom: 6px; }
.street-card { text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--bg); cursor: pointer; display: grid; gap: 6px; transition: border-color 0.15s, background 0.15s; }
.street-card:hover { border-color: var(--ink-3); }
.street-card.is-active { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.street-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.street-card-head .mono { font-size: 11px; color: var(--ink-3); }
.street-card p { font-size: 12.5px; color: var(--ink-2); }
.mini-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 2px 0 0; }
.mini-stats dt { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.mini-stats dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
.street-detail { padding: 22px max(16px, env(safe-area-inset-right, 0px)) 28px 24px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.sd-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.seg-metric { display: flex; flex-wrap: wrap; gap: 6px; }
.strip-wrap { display: grid; gap: 8px; overflow-x: auto; }
.strip { display: grid; gap: 3px; min-width: 620px; }
.strip-cell { position: relative; height: 92px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 0; background: color-mix(in oklab, var(--seq-hi) var(--k), var(--seq-lo)); transition: transform 0.12s; }
.strip-cell:hover { transform: translateY(-2px); }
.strip-cell.is-short::after { content: ''; position: absolute; top: -6px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--ochre); border: 2px solid var(--bg); }
.strip-cell.is-sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.strip-val { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--ink); background: var(--surface); padding: 0 3px; border-radius: 3px; }
.strip-id { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink); background: var(--surface); padding: 0 3px; border-radius: 3px; opacity: 0.85; }
.strip-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-3); }
.strip-ramp { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--seq-lo), var(--seq-hi)); border: 1px solid var(--line); }
.strip-key { display: inline-flex; align-items: center; gap: 5px; }
.key-short { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ochre); }
.sd-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.seg-panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.decision { background: var(--thesis-soft); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 6px; }
.decision h4 { color: var(--thesis); }
.decision .kv > div { border-color: color-mix(in oklab, var(--thesis) 25%, transparent); }
.seg-panel .btn-lg { justify-self: start; margin-top: 4px; }
.xsec { width: 100%; height: auto; max-height: 110px; }
.xs-bld { fill: var(--pl-bld); }
.xs-footpath { fill: var(--pl-footpath); stroke: var(--pl-kerb); stroke-width: 0.05; }
.xs-parking { fill: var(--pl-parking); }
.xs-lane { fill: var(--pl-lane); }
.xs-median { fill: var(--pl-median); }
.xs-label { font-size: 1.5px; font-family: var(--font-mono); fill: var(--ink-3); }

/* ---------- designer ---------- */
.designer { display: grid; grid-template-columns: minmax(0, 1fr) 390px; height: 100%; min-height: 0; }
.d-main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px 8px max(12px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.tb-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }

.pl-bld { fill: var(--pl-bld); }

.pl-footpath { fill: var(--pl-footpath); }

.pl-lane { fill: var(--pl-lane); }

.pl-veil { fill: var(--pl-veil); pointer-events: none; }

.pl-dim { font-size: 0.6px; fill: var(--ink-3); font-family: var(--font-mono); pointer-events: none; }
.pl-side { font-size: 0.6px; fill: var(--ink-3); font-family: var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; pointer-events: none; }
.pl-chain line { stroke: var(--ink-3); stroke-width: 0.06; }
.pl-chain text { font-size: 0.5px; fill: var(--ink-3); font-family: var(--font-mono); pointer-events: none; }
.pl-scale rect { fill: var(--ink); }
.pl-scale rect.alt { fill: var(--surface); stroke: var(--ink); stroke-width: 0.05; }
.pl-scale text { font-size: 0.55px; fill: var(--ink-2); font-family: var(--font-mono); }
.pl-vp circle { fill: var(--ochre); stroke: var(--surface); stroke-width: 0.12; }
.pl-vp-wedge { fill: var(--ochre); opacity: 0.16; stroke: var(--ochre); stroke-width: 0.05; }
.tree { cursor: move; }

.tree-crown > * { stroke-width: 0.1; fill-opacity: 1; transition: opacity 0.15s; }
.tree-texture, .tree-texture * { stroke: rgba(255, 255, 255, 0.45); stroke-width: 0.07; pointer-events: none; }
.tree-trunk { fill: #5d4a37; stroke: rgba(255, 255, 255, 0.7); stroke-width: 0.08; }
.tree:hover .tree-crown > * { opacity: 0.88; }
.tree-ring { fill: none; stroke: var(--ochre); stroke-width: 0.16; stroke-dasharray: 0.5 0.3; pointer-events: none; animation: spin 14s linear infinite; }
@keyframes spin { to { stroke-dashoffset: -16; } }
.tree-label { font-size: 0.62px; font-weight: 600; fill: var(--ink); font-family: var(--font-body); paint-order: stroke; stroke: var(--surface); stroke-width: 0.2; pointer-events: none; }
.tree.is-ghost { pointer-events: none; opacity: 0.55; }

.tree.is-invalid .tree-crown > * { stroke: var(--bad); stroke-dasharray: 0.4 0.25; opacity: 0.5; }
.zoom-ctl { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; box-shadow: var(--shadow); }
.hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; pointer-events: none; display: flex; align-items: center; max-width: calc(100% - 100px); overflow: hidden; text-overflow: ellipsis; }
.hint b { margin: 0 4px; }
.hint-soft { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); white-space: normal; text-align: center; }
.inspector { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; width: 250px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.insp-head { display: flex; align-items: center; gap: 4px; }

.library { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 12px 12px max(12px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; min-width: 0; }
.lib-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lib-filters { display: flex; gap: 5px; flex-wrap: wrap; }
.lib-search { margin-left: auto; width: 170px; }
.lib-row { display: grid; grid-auto-flow: column; grid-auto-columns: 216px; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
.sp-card { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); cursor: pointer; scroll-snap-align: start; transition: border-color 0.15s, transform 0.12s, background 0.15s; }
.sp-card:hover { border-color: var(--ink-3); transform: translateY(-1px); }

.sp-icon { flex: none; }
.lvl { font-weight: 600; }
.lvl-w-Low, .lvl-c-High { color: var(--good); }
.lvl-w-Moderate, .lvl-c-Moderate { color: var(--ink-2); }
.lvl-w-High, .lvl-c-Low { color: var(--warn); }
.d-side { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 12px 10px 10px; cursor: pointer; color: var(--ink-3); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.is-on { color: var(--ink); border-color: var(--accent); }
.side-body { overflow-y: auto; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 24px 14px; }
.feedback, .scenarios, .schemes, .method { display: grid; gap: 16px; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 11px; display: grid; gap: 4px; align-content: start; background: var(--bg); min-width: 0; }
.metric:nth-child(-n+3), .metric:last-child { grid-column: span 2; }
.metric-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
.metric-value { font-family: var(--font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.metric-unit { font-size: 13px; color: var(--ink-3); margin-left: 3px; font-weight: 500; }
.metric-sub { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
.metric-sub .src { margin-left: 2px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }
.meter i.m-exist { background: var(--thesis); }
.meter-scale { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); font-family: var(--font-mono); }
.meter-target { overflow: visible; }
.meter-target b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ochre); }
.dist { display: grid; gap: 4px; }
.dist-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.dist-bar i { display: block; height: 100%; }
.dist-legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--ink-2); }
.dist-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.dist-lo, .dist-good { background: var(--good); }
.dist-mid { background: var(--ink-3); }
.dist-hi, .dist-warn { background: var(--warn); }
.rating-scale { display: grid; gap: 3px; }
.rs-track { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--surface-2), var(--accent-soft)); border: 1px solid var(--line); }
.rs-track i { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); transition: left 0.25s; }
.rs-ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); }
.dims { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 4px 0 0; }
.dims dt { font-size: 10px; color: var(--ink-3); line-height: 1.2; }
.dims dd { margin: 0; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.panel-sec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.views { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.view { margin: 0; display: grid; gap: 3px; }
.view canvas { width: 100%; aspect-ratio: 1; border-radius: 5px; image-rendering: auto; background: var(--surface-2); max-width: 100%; }
.view figcaption { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); gap: 2px; }
.view figcaption b { font-family: var(--font-mono); color: var(--ink); }
.dchart { margin: 0; display: grid; gap: 6px; }
.dchart svg { width: 100%; height: auto; }
.dchart figcaption { font-size: 11px; color: var(--ink-3); }
.dc-grid line { stroke: var(--line); stroke-width: 1; }
.dc-grid text, .dc-axis { font-size: 9px; fill: var(--ink-3); font-family: var(--font-mono); }
.dc-band { fill: var(--accent); opacity: 0.13; }
.dc-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.dc-pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.dc-exist line { stroke: var(--thesis); stroke-width: 1.5; stroke-dasharray: 3 3; }
.dc-exist text { fill: var(--thesis); font-size: 9px; font-weight: 600; }
.dc-design line { stroke: var(--ochre); stroke-width: 2; }
.dc-design text { fill: var(--ochre); font-size: 9px; font-weight: 700; }
.dc-tip rect { fill: var(--ink); }
.dc-tip text { fill: var(--bg); font-size: 9.5px; font-family: var(--font-mono); }
.dc-tip .dc-tip-sub { opacity: 0.75; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; }
.target-status { display: grid; gap: 8px; }
.target-status p { font-size: 12.5px; color: var(--ink-2); }
.scheme-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; }
.slot.is-full { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.slot-head { display: flex; justify-content: space-between; align-items: baseline; }
.slot-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.compare th[scope='row'] { color: var(--ink-3); font-weight: 600; }
.compare td { font-size: 12px; }
.method-list { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.method-list .src { margin-right: 6px; }

/* ---------- species db ---------- */
.species-db, .visualise { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); max-width: 1360px; margin: 0 auto; display: grid; gap: 18px; }
.page-head { display: grid; gap: 10px; }
.prefchart { width: 100%; max-width: 820px; min-width: 560px; height: auto; display: block; }
.pc-grid line { stroke: var(--line); }
.pc-grid text { font-size: 10px; fill: var(--ink-3); font-family: var(--font-mono); }
.pc-hit { fill: transparent; }
.pc-row.is-hover .pc-hit { fill: var(--surface-2); }
.pc-name { font-size: 11.5px; fill: var(--ink); }
.pc-ci { stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; }
.pc-dot { stroke: var(--surface); stroke-width: 2; }
circle.pc-High { fill: var(--seq-hi); }
circle.pc-Moderate { fill: color-mix(in oklab, var(--seq-hi) 55%, var(--seq-lo)); }
circle.pc-Low { fill: color-mix(in oklab, var(--seq-hi) 22%, var(--seq-lo)); }
.pc-val { font-size: 10.5px; fill: var(--ink-2); font-family: var(--font-mono); }
.pc-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
.pc-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
i.pc-High { background: var(--seq-hi); }
i.pc-Moderate { background: color-mix(in oklab, var(--seq-hi) 55%, var(--seq-lo)); }
i.pc-Low { background: color-mix(in oklab, var(--seq-hi) 22%, var(--seq-lo)); border: 1px solid var(--ink-3); }
table.db td { white-space: nowrap; }
table.db tbody tr { cursor: pointer; }
table.db tbody tr:hover td { background: var(--surface-2); }
table.db tr.is-open td { background: var(--accent-soft); }
.th-btn { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; color: inherit; font-size: inherit; }
.db-name { display: flex; align-items: center; gap: 8px; }
.db-name span { display: grid; }
.db-name i { font-size: 11px; color: var(--ink-3); }
.sub { display: block; font-size: 10.5px; color: var(--ink-3); font-family: var(--font-mono); }
.sp-detail-head { display: flex; align-items: center; gap: 12px; }
.sp-detail-head i { color: var(--ink-3); }
.note { color: var(--warn); }

/* ---------- visualise ---------- */
.vis-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.drop { position: relative; display: grid; place-items: center; min-height: 340px; border: 2px dashed var(--line-2); border-radius: var(--r); background: var(--surface); cursor: pointer; overflow: hidden; }
.drop:hover { border-color: var(--accent); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop img { width: 100%; height: 100%; object-fit: cover; max-width: 100%; }
.drop.has-img { border-style: solid; }
.drop-empty { display: grid; justify-items: center; gap: 6px; color: var(--ink-3); text-align: center; padding: 20px; pointer-events: none; }
.drop-empty b { color: var(--ink); }
.steps { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); }
.err { color: var(--bad); font-size: 12.5px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .designer { grid-template-columns: minmax(0, 1fr) 340px; }
  .version { display: none; }
}
@media (max-width: 900px) {
  .home { grid-template-columns: 1fr; padding-top: 20px; }
  .home-stats { grid-template-columns: repeat(2, auto); }
  .streets { grid-template-columns: 1fr; }
  .street-list { border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .street-detail { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .sd-grid, .vis-grid { grid-template-columns: 1fr; }
  .view-design .stage { overflow: auto; }
  .designer { grid-template-columns: 1fr; height: auto; }
  .d-main { grid-template-rows: auto 62vh auto; }
  .d-side { border-left: 0; border-top: 1px solid var(--line); }
  .side-body { overflow: visible; }
  .inspector { width: auto; right: 12px; top: auto; bottom: 12px; }
  .lib-search { margin-left: 0; width: 100%; }
}
@media (max-width: 520px) {
  .topbar { gap: 10px; }
  .brand span { display: none; }
  .metric-grid { grid-template-columns: 1fr; }
  .metric:nth-child(-n+3), .metric:last-child { grid-column: auto; }
  .dims, .views { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .scheme-slots { grid-template-columns: 1fr; }
  .lib-row { grid-auto-columns: 78%; }
  .hint { white-space: normal; max-width: calc(100% - 80px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.scenarios table.data { font-size: 12px; }
.scenarios table.data td:first-child { white-space: nowrap; max-width: 122px; overflow: hidden; text-overflow: ellipsis; }
.scenarios table.data td, .scenarios table.data th { padding: 6px 4px; }
.wc { white-space: nowrap; font-size: 12px; }

/* ---------- simplified results UI ---------- */
.results { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.res-row { display: grid; gap: 5px; padding: 11px 14px; border-top: 1px solid var(--line); }
.res-row:first-child { border-top: 0; }
.res-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.res-label { font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.res-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.res-value small { font-size: 12px; color: var(--ink-3); margin-left: 2px; font-weight: 500; }
.res-note { font-size: 12px; color: var(--ink-3); }
.res-empty { font-size: 13px; color: var(--ink-2); background: var(--accent-soft); border-radius: var(--r-sm); padding: 10px 12px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot-thesis { background: var(--thesis); }
.dot-est { background: var(--ochre); }
.dot-calc { background: var(--ink-3); }
.legend-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 11.5px; color: var(--ink-3); }
.legend-line .dot { margin-left: 2px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; justify-self: start; }
.fold { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 10px; }
.fold > summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; display: flex; align-items: center; gap: 6px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: '›'; display: inline-block; transition: transform 0.15s; color: var(--ink-3); font-size: 16px; line-height: 1; }
.fold[open] > summary::before { transform: rotate(90deg); }
details.panel.fold { border-top: 1px solid var(--line); padding-top: 16px; }
.seg-ctl-sm { justify-self: start; }
.meter-gvi1 i { background: var(--ochre); }
.target-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.target-chips button { padding: 10px 0; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); font-family: var(--font-mono); font-size: 15px; font-weight: 600; cursor: pointer; }
.target-chips button.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.target-status p.ok { color: var(--good); font-weight: 600; }
.picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.picks li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); }
.pick-name { flex: 1; display: grid; font-weight: 600; font-size: 13px; min-width: 0; }
.pick-name small { font-weight: 400; color: var(--ink-3); font-size: 11.5px; font-family: var(--font-mono); }
.chip-btn { border: 0; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; }
.chip-btn:hover { filter: brightness(0.96); text-decoration: underline; }
.tabs { align-items: center; }
.tabs-info { margin-left: auto; }
.settings { display: grid; gap: 10px; padding-bottom: 6px; }
.decision p { font-size: 13px; }
.src { border: 0; padding: 0; font-weight: 500; }
.src::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; vertical-align: 1px; }
.lib-head h3 { font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.lib-head h3 b { color: var(--accent); }
.lib-row { grid-auto-columns: 168px; }
.sp-card { padding: 6px 8px; gap: 6px; }
.sp-meta { font-size: 11px; }
.sd-grid { grid-template-columns: minmax(0, 680px); align-items: start; }

<div id="root"></div>
